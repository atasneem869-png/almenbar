<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدعم الأكاديمي</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head>
<body data-page="support"><div id="site-header"></div>
<div class="container my-5"><h1 class="page-title">الدعم الأكاديمي</h1><p class="text-center fs-5 mb-5">لا تتردد في طرح أي سؤال او استفسار وسيتم الرد عليك في اقرب وقت ممكن</p>
<div class="support-card"><div class="row align-items-center gy-4"><div class="col-lg-6"><form><label class="mb-1">الاسم بالكامل</label><input class="form-control mb-3" required><label class="mb-1">البريد الالكتروني</label><input type="email" class="form-control mb-3" required><label class="mb-1">عنوان المشكلة او الاستفسار</label><input class="form-control mb-3" required><textarea class="form-control mb-2" rows="5" required></textarea><div class="d-flex justify-content-between align-items-center mb-3"><label class="m-0" for="file"><i class="bi bi-paperclip"></i> ارفق ملف</label><input type="file" id="file" class="form-control w-50"></div><button type="submit" class="btn btn-main">أرسل تقييمك</button></form></div><div class="col-lg-6"><img class="img-slot" src="./send.png" alt=""></div></div></div></div><div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/script.js"></script></body></html>
